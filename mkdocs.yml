site_name: REPACSS User Guide
site_url: https://nsfcac.github.io/repacss-user-guide/
use_directory_urls: false
site_description: Official documentation for the REPACSS HPC cluster at Texas Tech University
site_author: REPACSS Team
copyright: "&copy; 2026 Texas Tech University. All rights reserved."

theme:
  name: material
  custom_dir: repacss-theme/
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/images/Favicon.svg
  favicon: assets/images/Favicon.svg
  features:
    - search.suggest
    - content.footer.last-updated
    - content.code.copy
plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: false
      timezone: America/Chicago
      locale: en
extra:
  homepage: https://repacss.org/
  analytics:
    provider: google
    property: G-837FYSF17X
  social:
    - icon: material/home-circle
      link: https://www.repacss.org
      name: REPACSS Home
    - icon: material/help-circle
      link: https://guide.repacss.org/support.html
      name: REPACSS Help Desk
    # - icon: material/heart-pulse
    #   link: https://www.nersc.gov/users/status
    #   name: NERSC Center Status
    - icon: fontawesome/brands/github
      link: https://github.com/nsfcac
      name: NSFCAC GitHub
    - icon: fontawesome/brands/microsoft
      link: https://teams.microsoft.com/l/team/19%3AGUibrd_0s_qo4BQOAMlhkEVQ0gv1CMdSwiijRz_ey9c1%40thread.tacv2/conversations?groupId=8014973a-ed11-4aff-8a0c-09a4d34cd1fa&tenantId=178a51bf-8b20-49ff-b655-56245d5c173c
      name: NERSC User Group Slack


extra_css:
  - assets/stylesheets/extra.css

repo_name: nsfcac/repacss-user-guide
repo_url: https://github.com/nsfcac/repacss-user-guide
edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
 
  - Absolute Beginner Guide: absolute-beginner-guide.md

  - Getting and Managing Your Account:
      - Overview: account/index.md
      - ACCESS: account/access.md
      - TTU: account/ttu.md
      - External Accounts: account/external_accounts.md
      - Passwords: account/passwords.md
      - Policy: account/policy.md

  - Connecting to REPACSS:
      - Overview: connecting/index.md
      - VPN: connecting/vpn.md
      - MFA Setup: connecting/mfa.md
      - VSCode SSH: connecting/vscode.md

  - Running Jobs:
      - Job Basics: running-jobs/basics.md
      - Job Examples: running-jobs/examples.md
      - Determine Resource Needs: running-jobs/determining-resource-requirements.md
      - Interactive Sessions: running-jobs/interactive.md
      # - Checkpoint/Restart: running-jobs/checkpoint-restart.md
      - Scheduling: running-jobs/scheduling.md
      - Monitoring: running-jobs/monitoring.md
      - Best Practices: running-jobs/best-practices.md

  - Understanding Our Systems:
      - Architecture: understanding/repacss-system/architecture.md
      # - Known Issues: understanding/repacss-system/known-issues.md
      # - Vendor Bugs: understanding/repacss-system/vendor-bugs.md
      - File System:
        - File Transfer: understanding/repacss-system/file-system/file-transfer.md
        - File Permissions: understanding/repacss-system/file-system/unix-permissions.md 
        - Sharing File Access: understanding/repacss-system/file-system/ACL.md
      
  - Software:
      - Overview: software/index.md
      - Package Management:
          - HPC Applications (Module System): software/module-system.md
          - Data Science (MiniForge): software/miniforge.md
          - User Self-Installation:
              - Containers: software/containers.md
              - Building from Source: software/building-from-source.md
      - Popular User Applications:
          - Running Jupyter Notebook: software/jupyter-notebook.md
          - Running Ollama: software/running-ollama.md
      
  - Performance:
      - Compiler Flags: performance/compiler-flags.md
      # - Profiling Tools: performance/profiling-tools.md
      # - Scaling Tests: performance/scaling-tests.md

  - Resources:
      - Glossary: reference/glossary.md
      - Cheatsheet: reference/cheatsheet.md
      - Common Errors: reference/common-errors.md
      - FAQ: faq.md
      - Contact Us: support.md
      
